name: ci

on:
  push:
  pull_request:

jobs:
  server:
    name: server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Byte-compile
        run: python -m compileall -q server tests scripts
      - name: Packaging scripts
        run: |
          bash -n scripts/export_web.sh
          bash -n scripts/smoke_web.sh
          bash -n scripts/apply_postgres_migration.sh
          python3 -m py_compile scripts/web_build.py scripts/browser_smoke.py scripts/serve_web.py
          test -f client/export_presets.cfg
          grep -q 'thread_support=false' client/export_presets.cfg
          test -f infra/deploy/cloudflare/_headers
          test -f infra/deploy/caddy/Caddyfile
          test -f infra/deploy/production.env.example
          echo "This job does not export the web build. The web job does."

  client:
    name: godot 4.7.2 headless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip
      - name: Headless client check
        run: ./scripts/check_client.sh

  web:
    name: web export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install unzip and Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb
      - name: Cache Godot editor and export templates
        uses: actions/cache@v4
        with:
          path: |
            .tools/godot
            ~/.local/share/godot/export_templates
          key: godot-4.7.2-stable-nothreads-${{ runner.os }}
      - name: Export and verify the browser build
        run: ./scripts/export_web.sh
      - name: MIME smoke
        run: ./scripts/smoke_web.sh
      - name: Headless Chrome load
        run: |
          set +e
          python3 scripts/browser_smoke.py
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "Chrome loaded the page and the load check failed."
            exit 1
          fi
          if [ "$code" -eq 2 ]; then
            echo "BROWSER_SMOKE_UNVERIFIED" >> "$GITHUB_STEP_SUMMARY"
            echo "Chrome did not produce a DOM. This is not a passed browser test."
            exit 0
          fi
          echo "BROWSER_SMOKE_OK is a canvas load only. It is not a completed match." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: market-dominion-web
          if-no-files-found: error
          path: |
            build/web/index.html
            build/web/index.js
            build/web/index.wasm
            build/web/index.pck
            build/web/md-config.js
            build/web/BUILD.txt
            build/web/_headers
