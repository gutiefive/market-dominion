name: ci

on:
  push:
  pull_request:

jobs:
  server:
    name: server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Byte-compile
        run: python -m compileall -q server tests scripts
      - name: Packaging scripts (no export templates, no Docker)
        run: |
          bash -n scripts/export_web.sh
          bash -n scripts/smoke_web.sh
          bash -n scripts/apply_postgres_migration.sh
          test -f client/export_presets.cfg
          grep -q 'thread_support=false' client/export_presets.cfg
          echo "CI does not download Godot export templates, run the web export, or build a container image."

  client:
    name: godot 4.7.2 headless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip
      - name: Headless client check
        run: ./scripts/check_client.sh
